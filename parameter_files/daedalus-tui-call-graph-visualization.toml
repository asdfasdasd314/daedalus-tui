# Select the checkout to analyze.  ``current`` uses the launch directory;
# any other name defaults to <projects_root>/<name> below.
analysis_project = "current"
projects_root = "~/Projects"

source_globs = ["tui/**/*.py"]
exclude = ["tests/**", "**/test_*.py", "graphify-out/**", ".venv/**"]
entry_points = ["tui.__main__.main"]
output_path = "call-graph-out/call-tree.html"
max_tree_depth = 12
pyan_depth = 2
similarity_enabled = true
embedding_backend = "sklearn-tfidf"
max_neighbors_in_descriptor = 20
max_sibling_pairs_per_parent = 50
feature_similarity_threshold = 0.55
similarity_display_low = 0.25
similarity_display_high = 0.55
similarity_tint_siblings = false
write_similarity_json = true
variable_lineage_enabled = true
write_variable_lineage_json = true
variable_stats_row_limit = 200

# These defaults make an arbitrary non-Daedalus Python checkout analyzable
# without first adding Daedalus files.  A [projects."name"] table below can
# override the root or any of these settings for a project with an unusual
# layout.  Target-local parameters still take final precedence.
[project_defaults]
source_globs = ["**/*.py"]
exclude = [
  "tests/**",
  "**/test_*.py",
  ".git/**",
  ".venv/**",
  "venv/**",
  "__pycache__/**",
  "**/__pycache__/**",
  "build/**",
  "dist/**",
  "node_modules/**",
  "vendor/**",
]
entry_points = []

# Example for a checkout outside projects_root or with project-specific
# analysis settings:
# [projects."my-project"]
# root = "/absolute/path/to/my-project"
# source_globs = ["python/**/*.py"]
# entry_points = ["my_project.app.main"]

# Local branch that task worktrees are based on and that successful tasks
# promote into. Defaults to main; change this to any local branch name.
# The operator does not need this branch checked out while the TUI runs.
target_branch = "main"
worktree_root = ".daedalus-worktrees"
task_verification_attempt_limit = 3
resolver_attempt_limit = 3
max_concurrent_tasks = 4
agent_timeout_seconds = 450
shutdown_grace_seconds = 8
debug_log_filename = ".daedalus-debug.log"
graphify_update_enabled = true
graphify_executable = "graphify"

# An empty list discovers root and one-level nested npm/pytest suites.
verification_commands = []
